<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        document.documentElement.classList.add('loading-active');
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style id="critical-loader">
      html.loading-active {
        overflow: hidden;
      }
      html.loading-active body {
        overflow: hidden;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--background, #ffffff);
        transition: opacity 0.3s ease-out;
      }
      .dark #app-loader {
        background: var(--background, #1a1a2e);
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid var(--muted, #e2e8f0);
        border-top-color: var(--primary, #d4a574);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .dark #app-loader .spinner {
        border-color: var(--muted, #334155);
        border-top-color: var(--primary, #d4a574);
      }
      #app-loader .skeleton-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: linear-gradient(90deg, var(--muted, #f1f5f9) 25%, var(--border, #e2e8f0) 50%, var(--muted, #f1f5f9) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      .dark #app-loader .skeleton-header {
        background: linear-gradient(90deg, var(--muted, #1e293b) 25%, var(--border, #334155) 50%, var(--muted, #1e293b) 75%);
        background-size: 200% 100%;
      }
      #app-loader .skeleton-content {
        width: 100%;
        max-width: 1200px;
        padding: 100px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #app-loader .skeleton-line {
        height: 20px;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--muted, #f1f5f9) 25%, var(--border, #e2e8f0) 50%, var(--muted, #f1f5f9) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      .dark #app-loader .skeleton-line {
        background: linear-gradient(90deg, var(--muted, #1e293b) 25%, var(--border, #334155) 50%, var(--muted, #1e293b) 75%);
        background-size: 200% 100%;
      }
      #app-loader .skeleton-line:nth-child(1) { width: 60%; }
      #app-loader .skeleton-line:nth-child(2) { width: 80%; }
      #app-loader .skeleton-line:nth-child(3) { width: 45%; }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      #root.loaded {
        opacity: 1;
      }
    </style>
    <!--app-head-->
  </head>
  <body class="bg-background">
    <div id="app-loader">
      <div class="skeleton-header"></div>
      <div class="skeleton-content">
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>
      <div class="spinner"></div>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
